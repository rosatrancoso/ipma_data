name: Update IPMA observations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipma-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download, update and publish database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="db"
          db="$RUNNER_TEMP/ipma_observations.sqlite3"
          backup="$RUNNER_TEMP/ipma_observations.backup.sqlite3"

          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ipma_observations.sqlite3" \
            --dir "$RUNNER_TEMP"

          test -s "$db"
          cp "$db" "$backup"

          #python3 ipma_observations_to_sqlite.py --db "$db"
          
          for attempt in 1 2 3; do
            if python3 ipma_observations_to_sqlite.py --db "$db" --timeout 120; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "IPMA update failed after 3 attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 30 seconds..."
            sleep 30
          done

          python3 -c '
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as db:
              result = db.execute("PRAGMA integrity_check").fetchone()[0]
          if result != "ok":
              sys.exit(f"Database integrity check failed: {result}")
          ' "$db"

          gh release upload "$tag" "$backup" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$tag" "$db" \
            --repo "$GITHUB_REPOSITORY" --clobber
